[project]
name = "copilot"
version = "0.1.0"
description = "Live talk copilot: on-box ASR + LLM that keeps a speaker on plan and on time"
requires-python = ">=3.12"
dependencies = [
  "torch>=2.9",
  "transformers>=5.13.0",
  "fastapi",
  "uvicorn[standard]",
  "httpx",
  "numpy",
  "librosa",
]

[tool.uv.sources]
torch = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
